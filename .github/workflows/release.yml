name: Release

# Pushing a v* tag builds both installers and attaches them to a draft GitHub release
# (publish settings in electron-builder.yml). The draft is published by hand.
on:
  push:
    tags: ['v*']
  # Dry run: builds both installers without publishing anything (artifacts only).
  workflow_dispatch:
    inputs:
      dry_run:
        description: Informational - a manual run never publishes; it builds and uploads workflow artifacts only
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write # electron-builder creates the draft release on a tag
    defaults:
      run:
        shell: bash
    env:
      # Ad-hoc signed Mac build (mac.identity "-"); never pick up a real certificate.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore Kokoro model cache
        uses: actions/cache@v5
        with:
          path: resources/models
          key: kokoro-model-${{ runner.os }}-${{ hashFiles('scripts/model-manifest.json') }}

      - run: npm run fetch-model

      - run: npm run typecheck
      - run: npm test

      - name: Build and publish to a draft release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-vite build && npx electron-builder --publish always

      - name: Build (dry run, nothing published)
        if: github.event_name == 'workflow_dispatch'
        run: npx electron-vite build && npx electron-builder --publish never

      - name: Upload installers (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  ffmpeg-source:
    name: ffmpeg source
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # attaches files to the draft release on a tag
    steps:
      - uses: actions/checkout@v5

      - name: Download and verify the pinned FFmpeg source
        run: |
          url=$(jq -r .url scripts/ffmpeg-source.json)
          sha=$(jq -r .sha256 scripts/ffmpeg-source.json)
          file=$(jq -r .tarball scripts/ffmpeg-source.json)
          curl -fsSL --retry 3 -o "$file" "$url"
          echo "$sha  $file" | sha256sum -c -

      - name: Write FFMPEG-SOURCE.md
        run: |
          ver=$(jq -r .ffmpegVersion scripts/ffmpeg-source.json)
          file=$(jq -r .tarball scripts/ffmpeg-source.json)
          sha=$(jq -r .sha256 scripts/ffmpeg-source.json)
          url=$(jq -r .url scripts/ffmpeg-source.json)
          sver=$(jq -r .ffmpegStatic.version scripts/ffmpeg-source.json)
          stag=$(jq -r .ffmpegStatic.releaseTag scripts/ffmpeg-source.json)
          surl=$(jq -r .ffmpegStatic.releaseUrl scripts/ffmpeg-source.json)
          spkg=$(jq -r .ffmpegStatic.package scripts/ffmpeg-source.json)
          win=$(jq -r .builders.windowsX64 scripts/ffmpeg-source.json)
          mac=$(jq -r .builders.macosArm64 scripts/ffmpeg-source.json)
          cat > FFMPEG-SOURCE.md <<EOF
          # FFmpeg source for Tide

          The \`ffmpeg\` program bundled with Tide is FFmpeg $ver, taken from the npm package
          [ffmpeg-static]($spkg) $sver (release tag [$stag]($surl)). These are GPL builds
          (GNU GPL version 3), so the corresponding source is provided.

          - Source tarball: \`$file\` (attached to this release), also at $url
          - SHA-256: \`$sha\`

          Builders of the bundled binaries, as listed by ffmpeg-static (build scripts and configuration):

          - Windows x64: $win
          - macOS Apple Silicon (arm64): $mac
          EOF
          cat FFMPEG-SOURCE.md

      - name: Attach to the draft release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The first real v* tag is the first live test of this step (a dry run skips it).
        run: |
          id=""
          for attempt in 1 2 3 4 5 6; do
            id=$(gh api "repos/${{ github.repository }}/releases" --paginate               --jq '.[] | select(.tag_name=="'"$GITHUB_REF_NAME"'") | .id' | head -n1)
            [ -n "$id" ] && break
            echo "Draft release for $GITHUB_REF_NAME not found (attempt $attempt); retrying"
            sleep 10
          done
          if [ -z "$id" ]; then
            echo "::error::No release (draft) found for tag $GITHUB_REF_NAME; cannot attach the FFmpeg source"
            exit 1
          fi
          for f in ffmpeg-6.1.1.tar.xz FFMPEG-SOURCE.md; do
            # --clobber equivalent: delete an existing asset of the same name first
            old=$(gh api "repos/${{ github.repository }}/releases/$id/assets" --paginate               --jq '.[] | select(.name=="'"$f"'") | .id')
            for a in $old; do gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$a"; done
            gh api -X POST "https://uploads.github.com/repos/${{ github.repository }}/releases/$id/assets?name=$f"               -H "Content-Type: application/octet-stream" --input "$f"
          done

      - name: Upload source files (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-source
          path: |
            ffmpeg-6.1.1.tar.xz
            FFMPEG-SOURCE.md
