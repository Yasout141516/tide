name: Release

# Pushing a v* tag builds both installers and attaches them to a draft GitHub release
# (publish settings in electron-builder.yml). The draft is published by hand.
on:
  push:
    tags: ['v*']
  # Dry run: a manual run never publishes; it builds both installers and uploads workflow artifacts only.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ffmpeg-source-fetch:
    name: ffmpeg source (fetch and verify)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          expected="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version (expected $expected)"
            exit 1
          fi

      - name: Check the pinned FFmpeg source matches ffmpeg-static
        run: |
          locked=$(jq -r '.packages["node_modules/ffmpeg-static"].version' package-lock.json)
          pinned=$(jq -r .ffmpegStatic.version scripts/ffmpeg-source.json)
          if [ "$locked" != "$pinned" ]; then
            echo "::error::package-lock.json has ffmpeg-static $locked but scripts/ffmpeg-source.json pins $pinned; update the pinned FFmpeg source"
            exit 1
          fi

      - name: Download and verify the pinned FFmpeg source
        run: |
          eval "$(jq -r '@sh "url=\(.url) sha=\(.sha256) file=\(.tarball)"' scripts/ffmpeg-source.json)"
          mkdir ffmpeg-source
          curl -fsSL --retry 3 -o "ffmpeg-source/$file" "$url"
          (cd ffmpeg-source && echo "$sha  $file" | sha256sum -c -)

      - name: Write FFMPEG-SOURCE.md
        run: |
          eval "$(jq -r '@sh "ver=\(.ffmpegVersion) file=\(.tarball) sha=\(.sha256) url=\(.url) sver=\(.ffmpegStatic.version) stag=\(.ffmpegStatic.releaseTag) surl=\(.ffmpegStatic.releaseUrl) spkg=\(.ffmpegStatic.package) win=\(.builders.windowsX64) mac=\(.builders.macosArm64)"' scripts/ffmpeg-source.json)"
          cat > ffmpeg-source/FFMPEG-SOURCE.md <<EOF
          # FFmpeg source for Tide

          The \`ffmpeg\` program bundled with Tide is FFmpeg $ver, taken from the npm package
          [ffmpeg-static]($spkg) $sver (release tag [$stag]($surl)). These are GPL builds
          (GNU GPL version 3), so the corresponding source is provided.

          - Source tarball: \`$file\` (attached to this release), also at $url
          - SHA-256: \`$sha\`

          Builders of the bundled binaries, as listed by ffmpeg-static (build scripts and configuration):

          - Windows x64: $win
          - macOS Apple Silicon (arm64): $mac
          EOF
          cat ffmpeg-source/FFMPEG-SOURCE.md

      # Handed to the attach job (tag runs) and kept as the dry-run artifact (dispatch runs).
      - name: Upload source files
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-source
          path: ffmpeg-source/
          if-no-files-found: error

  release:
    name: release (${{ matrix.os }})
    needs: ffmpeg-source-fetch
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write # electron-builder creates the draft release on a tag
    defaults:
      run:
        shell: bash
    env:
      # Ad-hoc signed Mac build (mac.identity "-"); never pick up a real certificate.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Before npm ci: the Electron binary is downloaded by its postinstall.
      - name: Restore Electron and electron-builder download caches
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.os == 'macOS' && '~/Library/Caches/electron' || '~\AppData\Local\electron\Cache' }}
            ${{ runner.os == 'macOS' && '~/Library/Caches/electron-builder' || '~\AppData\Local\electron-builder\Cache' }}
          key: electron-dl-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Restore Kokoro model cache
        uses: actions/cache@v5
        with:
          path: resources/models
          key: kokoro-model-${{ runner.os }}-${{ hashFiles('scripts/model-manifest.json') }}

      - run: npm run fetch-model

      - run: npm run typecheck
      - run: npm test

      # A tag run publishes to a draft release (needs GH_TOKEN); a manual run builds only.
      - name: Build (and publish to a draft release on a tag)
        env:
          GH_TOKEN: ${{ github.event_name != 'workflow_dispatch' && secrets.GITHUB_TOKEN || '' }}
        run: npx electron-vite build && npx electron-builder --publish ${{ github.event_name == 'workflow_dispatch' && 'never' || 'always' }}

      - name: Upload installers (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  ffmpeg-source-attach:
    name: ffmpeg source (attach to draft)
    if: github.event_name != 'workflow_dispatch'
    needs: [ffmpeg-source-fetch, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # attaches files to the draft release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-source
          path: ffmpeg-source

      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The first real v* tag is the first live test of this step (a dry run skips it).
        # The draft is looked up by id (with retries): gh cannot reliably address an unpublished draft by tag.
        run: |
          repo="$GITHUB_REPOSITORY"
          id=""
          for attempt in 1 2 3 4 5 6; do
            id=$(gh api "repos/$repo/releases" --paginate \
              --jq '.[] | select(.tag_name=="'"$GITHUB_REF_NAME"'") | .id' | head -n1)
            [ -n "$id" ] && break
            echo "Draft release for $GITHUB_REF_NAME not found (attempt $attempt); retrying"
            sleep 10
          done
          if [ -z "$id" ]; then
            echo "::error::No release (draft) found for tag $GITHUB_REF_NAME; cannot attach the FFmpeg source"
            exit 1
          fi
          for path in ffmpeg-source/*; do
            f=$(basename "$path")
            # --clobber equivalent: delete an existing asset of the same name first
            old=$(gh api "repos/$repo/releases/$id/assets" --paginate \
              --jq '.[] | select(.name=="'"$f"'") | .id')
            for a in $old; do gh api -X DELETE "repos/$repo/releases/assets/$a"; done
            gh api -X POST "https://uploads.github.com/repos/$repo/releases/$id/assets?name=$f" \
              -H "Content-Type: application/octet-stream" --input "$path"
          done
