appId: com.yasout141516.tide
productName: Tide
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!local-fixtures/**'
  - '!tests/**'
  - '!docs/**'
  - '!scripts/**'
  # The model ships once, via extraResources below, not inside the asar.
  - '!resources/**'
  - '!{test-results,playwright-report,.superpowers,.github}/**'
  - '!{electron.vite.config,playwright.config,vitest.config}.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # transformers.js only loads onnxruntime-web in a browser; its Node build never imports it.
  - '!node_modules/onnxruntime-web/**'
  # onnxruntime-node ships prebuilt binaries for every OS and arch; keep only the target's own
  # (${platform} is darwin or win32, ${arch} arm64 or x64). Per-platform `files` lists are not used:
  # electron-builder 26 then drops its default exclusions (.git, release/, local-fixtures/ shipped).
  - '!node_modules/onnxruntime-node/bin/napi-v*/!(${platform})/**'
  - '!node_modules/onnxruntime-node/bin/napi-v*/${platform}/!(${arch})/**'
  # kokoro-js ships every voice; Tide offers ten (src/shared/voices.ts), so drop the rest.
  - '!node_modules/kokoro-js/voices/!(af_kore|af_nicole|af_sarah|am_fenrir|am_michael|am_puck|bf_emma|bf_isabella|bm_fable|bm_george).bin'
  # sharp and its native @img/sharp-* binary stay: transformers.js imports sharp statically at load
  # time, and sharp throws when its native binary is missing (checked: kokoro-js then fails to load).
# Runtime modules that read their own files from disk (kokoro-js voices) or ship native
# binaries (onnxruntime-node, ffmpeg-static) must exist outside the asar archive.
asarUnpack:
  - node_modules/onnxruntime-node/**
  - node_modules/kokoro-js/**
  - node_modules/@huggingface/transformers/**
  - node_modules/phonemizer/**
  - node_modules/ffmpeg-static/**
# Only the fp32 model and its JSON files ship; never the quantized model or other dtypes.
extraResources:
  - from: resources/models
    to: models
    filter:
      - '**/*.json'
      - '**/onnx/model.onnx'
mac:
  target:
    - target: dmg
      arch: [arm64]
  # Ad-hoc signature: no Apple account, but macOS offers "Open Anyway" instead of "damaged".
  identity: '-'
  hardenedRuntime: false
  notarize: false
  # "Open with Tide" in Finder. Mac only: electron-builder's NSIS association can claim the default
  # .pdf app on Windows (spec 6.6 forbids that; Windows "Open with" is deferred to M7).
  fileAssociations:
    - ext: pdf
      name: PDF document
      role: Viewer
      rank: Alternate
  category: public.app-category.education
  # Reopening a recent PDF by path from these folders triggers a macOS privacy prompt.
  extendInfo:
    NSDocumentsFolderUsageDescription: Tide reads the PDFs you open from your Documents folder.
    NSDownloadsFolderUsageDescription: Tide reads the PDFs you open from your Downloads folder.
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
# Used only by release.yml (`--publish always` on a v* tag); CI and `npm run package` never publish.
publish:
  provider: github
  releaseType: draft
# All native deps are N-API prebuilds; nothing to rebuild against Electron's headers.
npmRebuild: false
